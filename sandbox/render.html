<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Render kit bench</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #e8e8e8; overflow: hidden; }
      body { font: 13px/1.4 'Inter Variable', system-ui, sans-serif; }
      canvas { display: block; }
      #hud { position: fixed; left: 0; top: 0; padding: 12px 16px 28px 16px; pointer-events: none;
        background: linear-gradient(180deg, rgb(0 0 0 / 0.85), rgb(0 0 0 / 0)); max-width: 70ch; }
      #hud h1 { font-weight: 500; font-size: 15px; margin: 0 0 4px; }
      #hud p { margin: 0; color: #bebebe; white-space: pre-line; }
      #grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; gap: 1px; height: 100%; background: #222; }
      #grid iframe { border: 0; width: 100%; height: 100%; background: #000; }
      .mark { position: fixed; pointer-events: none; color: #e9ca80; font: 12px 'JetBrains Mono', monospace; transform: translate(-50%, -50%); }
    </style>
  </head>
  <body>
    <script type="module" src="./render.ts"></script>
  </body>
</html>
