<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Camera sandbox</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #e8e6e1; overflow: hidden;
        font: 12px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif; }
      #view { position: fixed; inset: 0; }
      #view canvas { display: block; width: 100%; height: 100%; }
      #hud { position: fixed; left: 16px; top: 12px; max-width: 460px; pointer-events: none;
        text-shadow: 0 0 6px #000, 0 0 2px #000; }
      #hud .scale { font-size: 28px; letter-spacing: 0.01em; }
      #hud .mono { font-family: ui-monospace, 'JetBrains Mono', Consolas, monospace; font-size: 11px; opacity: 0.8; }
      #controls { position: fixed; left: 16px; bottom: 14px; display: flex; flex-wrap: wrap; gap: 4px; max-width: 70vw; }
      #controls button { background: rgba(0,0,0,0.55); color: #e8e6e1; border: 1px solid #555; border-radius: 3px;
        padding: 4px 8px; font: inherit; cursor: pointer; }
      #controls button:hover { border-color: #c9a96b; }
      #controls .sep { width: 10px; }
      .label { position: fixed; transform: translate(8px, -50%); pointer-events: none; white-space: nowrap;
        font-size: 11px; color: #d8d4cc; text-shadow: 0 0 4px #000; }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <div id="hud"></div>
    <div id="labels"></div>
    <div id="controls"></div>
    <script type="module" src="./camera.ts"></script>
  </body>
</html>
